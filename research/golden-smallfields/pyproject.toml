[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecbench-golden"
version = "1.0.0"
description = "Golden elliptic-curve fixtures and polynomial index-calculus benchmark battery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
algebra = ["sympy>=1.13,<2"]
validation = ["jsonschema>=4"]
report = ["reportlab>=4", "pypdf>=5"]

[project.scripts]
ecbench = "ecbench.cli:main"

[tool.setuptools]
packages = ["ecbench"]

[tool.setuptools.package-data]
ecbench = ["data/*.json"]
